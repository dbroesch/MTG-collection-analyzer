databases:
  - name: mtg-collection-db
    plan: free
    databaseName: mtg_collection
    user: mtg_user

services:
  - type: web
    name: mtg-collection-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd website && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: mtg-collection-db
          property: connectionString
